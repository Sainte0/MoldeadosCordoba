# Estáticos de la app (detrás de Traefik, que ya hace HTTPS y manda /api al backend).
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Archivos con hash en el nombre: no cambian nunca, el navegador los guarda un año.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location ~* \.(webp|png|webmanifest)$ { expires 7d; try_files $uri =404; }
    # El service worker (modo sin conexión) no se cachea: si no, un deploy tardaría días en llegar.
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    # index.html sin caché: un deploy se ve al instante. El resto lo resuelve la app (rutas del cliente).
    location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
